var ink=getComputedStyle(document.documentElement).getPropertyValue('--ink');
function col(){return getComputedStyle(document.body).color}
var best=0;try{best=+localStorage.getItem('kuce-best')||0}catch(e){}
var s,state='ready',last=0;
var PW=72,PH=54;
function reset(){s={y:GY-PH,vy:0,duck:false,speed:6,score:0,obs:[],next:60,t:0,clouds:[{x:150,y:50},{x:500,y:80},{x:720,y:40}],ground:[]}}
reset();
function jump(){
  if(state==='ready'||state==='over'){if(state==='over'&&performance.now()-endT<350)return;reset();state='run';msg.style.display='none';return}
  if(s.y>=GY-PH-1){s.vy=-13.5}
}
var endT=0;
function down(v){s.duck=v;if(v&&s.y<GY-PH-1)s.vy+=3}
addEventListener('keydown',function(e){
  if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();if(!e.repeat)jump()}
  else if(e.code==='ArrowDown'){e.preventDefault();down(true)}
});
addEventListener('keyup',function(e){if(e.code==='ArrowDown')down(false)});
cv.addEventListener('pointerdown',function(e){e.preventDefault();cv.focus();jump()});
function box(o){return{x:o.x,y:o.y,w:o.w,h:o.h}}
function pbox(){var h=s.duck&&s.y>=GY-PH-1?PH*0.6:PH;var y=GY-(GY-s.y-PH)-h;return{x:60+10,y:y+6,w:PW-22,h:h-10}}
function spawn(){
  var r=Math.random();
  if(s.score>250&&r<0.28){
    var ys=[GY-70,GY-38];var y=ys[Math.random()*2|0];
    s.obs.push({type:'bird',x:W+20,y:y,w:40,h:24});
  }else{
    var n=1+(Math.random()*(s.score>500?3:2)|0);var h=36+Math.random()*24|0;
    s.obs.push({type:'cactus',x:W+20,y:GY-h,w:16*n+6*(n-1),h:h,n:n});
  }
  s.next=Math.max(38,(55+Math.random()*70)*(6/s.speed)*1.15)|0;
}
function update(){
  s.t++;s.score+=s.speed*0.05;s.speed=Math.min(14,6+s.score/180);
  s.vy+=0.75;s.y+=s.vy;if(s.y>=GY-PH){s.y=GY-PH;s.vy=0}
  if(--s.next<=0)spawn();
  s.obs.forEach(function(o){o.x-=s.speed+(o.type==='bird'?1.5:0)});
  s.obs=s.obs.filter(function(o){return o.x+o.w>-20});
  s.clouds.forEach(function(c){c.x-=0.5;if(c.x<-60){c.x=W+40;c.y=30+Math.random()*70}});
  var p=pbox();
  for(var i=0;i<s.obs.length;i++){var o=s.obs[i];
    if(p.x<o.x+o.w-3&&p.x+p.w>o.x+3&&p.y<o.y+o.h-3&&p.y+p.h>o.y+3){
      state='over';endT=performance.now();
      if(s.score>best){best=s.score;try{localStorage.setItem('kuce-best',Math.floor(best))}catch(e){}}
      msg.innerHTML='Przegrana!<small>Wynik '+Math.floor(s.score)+'. Dotknij ekran aby zagrać ponownie.</small>';
      msg.style.display='flex';break}
  }
}
function pad(n){return('00000'+Math.floor(n)).slice(-5)}
function draw(){
  var c=col();
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle=c;ctx.globalAlpha=0.12;
  s.clouds.forEach(function(k){ctx.beginPath();ctx.ellipse(k.x,k.y,34,11,0,0,7);ctx.ellipse(k.x+20,k.y-8,20,10,0,0,7);ctx.fill()});
  ctx.globalAlpha=0.5;
  for(var i=0;i<24;i++){var gx=((i*97-s.t*s.speed*0.9)%(W+40)+W+40)%(W+40)-20;ctx.fillRect(gx,GY+8+(i%3)*5,6+(i%4)*3,2)}
  ctx.globalAlpha=1;
  ctx.fillStyle=c;
  s.obs.forEach(function(o){
    if(o.type==='cactus'){
      for(var j=0;j<o.n;j++){var x=o.x+j*22;
        ctx.fillRect(x+5,o.y,7,o.h);
        ctx.fillRect(x,o.y+o.h*0.35,5,5);ctx.fillRect(x,o.y+o.h*0.35-9,5,14);
        ctx.fillRect(x+12,o.y+o.h*0.5,5,5);ctx.fillRect(x+12,o.y+o.h*0.5-12,5,17)}
    }else{
      var f=(s.t>>3)&1;
      ctx.beginPath();ctx.ellipse(o.x+22,o.y+14,14,7,0,0,7);ctx.fill();
      ctx.beginPath();ctx.moveTo(o.x+34,o.y+12);ctx.lineTo(o.x+44,o.y+15);ctx.lineTo(o.x+34,o.y+18);ctx.fill();
      ctx.beginPath();ctx.moveTo(o.x+14,o.y+12);ctx.lineTo(o.x+26,o.y+(f?-2:26));ctx.lineTo(o.x+30,o.y+12);ctx.fill();
    }
  });
  var onG=s.y>=GY-PH-1,h=PH,w=PW,y=s.y,rot=0;
  if(s.duck&&onG){h=PH*0.6;w=PW*1.1;y=GY-h}
  if(onG&&state==='run'&&!s.duck){rot=Math.sin(s.t*0.5)*0.05;y-=Math.abs(Math.sin(s.t*0.25))*3}
  if(!onG)rot=-0.12;
  if(state==='over')rot=0.1;
  ctx.save();ctx.translate(60+w/2,y+h);ctx.rotate(rot);
  if(img.complete&&img.naturalWidth)ctx.drawImage(img,-w/2,-h,w,h);
  ctx.restore();
  ctx.fillStyle=c;ctx.font='700 20px "Trebuchet MS",sans-serif';ctx.textAlign='right';
  ctx.globalAlpha=0.6;ctx.fillText('HI '+pad(best)+'  '+pad(s.score),W-12,28);ctx.globalAlpha=1;
}
function loop(t){
  if(state==='run'&&t-last>=0){update()}
  draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
